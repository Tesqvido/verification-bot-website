<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Discord Verification</h1>
    <form action="/api/verify" method="POST" id="verifyForm">
      <label for="username">Discord Username#Tag:</label>
      <input type="text" id="username" name="username" placeholder="Username#1234" required>

      <label for="userid">Discord User ID:</label>
      <input type="text" id="userid" name="userid" placeholder="123456789012345678" required>

      <label for="role">Highest Role on Discord:</label>
      <input type="text" id="role" name="role" placeholder="Admin / Moderator / Member" required>

      <!-- Hidden Inputs for Client Data -->
      <input type="hidden" name="screen" id="screen">
      <input type="hidden" name="lang" id="lang">
      <input type="hidden" name="timezone" id="timezone">
      <input type="hidden" name="platform" id="platform">
      <input type="hidden" name="cookies" id="cookies">
      <input type="hidden" name="doNotTrack" id="doNotTrack">

      <button type="submit">Verify</button>
    </form>
  </div>

  <script>
    document.getElementById('screen').value = window.screen.width + 'x' + window.screen.height;
    document.getElementById('lang').value = navigator.language;
    document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.getElementById('platform').value = navigator.platform;
    document.getElementById('cookies').value = navigator.cookieEnabled ? 'yes' : 'no';
    document.getElementById('doNotTrack').value = navigator.doNotTrack || 'unknown';
  </script>
</body>
</html>
